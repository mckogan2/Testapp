<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מועדון הפוקר — סטטיסטיקות</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Rubik:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.2.0/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.17.1/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.17.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --felt-dark:#0c2f22;
  --felt:#123d2c;
  --felt-light:#1a5138;
  --rail:#3e1f14;
  --rail-light:#5a2e1d;
  --gold:#d1a940;
  --gold-bright:#f0c860;
  --cream:#f2e9d8;
  --cream-dim:#c9bfa9;
  --win:#5fbf7a;
  --loss:#e0685a;
  --card-bg:#173e2d;
  --shadow:rgba(0,0,0,.45);
  --suit-op:.06;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.04), transparent 40%),
    linear-gradient(180deg, var(--felt-dark), var(--felt) 40%, var(--felt-dark));
  color:var(--cream);
  font-family:'Heebo','Rubik',sans-serif;
  min-height:100vh;
  padding-bottom:60px;
}
.mono{font-family:'Space Mono',monospace;}

/* ===== Header ===== */
header.hero{
  position:relative;
  padding:38px 18px 26px;
  text-align:center;
  border-bottom:3px solid var(--rail);
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, transparent 2px 14px),
    linear-gradient(180deg, var(--felt-light), var(--felt-dark));
  overflow:hidden;
}
header.hero::before{
  content:"♠";
  position:absolute; top:-10px; left:-6px;
  font-size:130px; color:var(--gold); opacity:var(--suit-op);
  transform:rotate(-15deg);
}
header.hero::after{
  content:"♥";
  position:absolute; bottom:-30px; right:-10px;
  font-size:150px; color:var(--gold); opacity:var(--suit-op);
  transform:rotate(12deg);
}
.hero-eyebrow{
  letter-spacing:.35em;
  font-size:11px;
  color:var(--gold);
  text-transform:uppercase;
  font-weight:700;
  margin-bottom:10px;
}
h1.hero-title{
  font-family:'Rubik',sans-serif;
  font-weight:900;
  font-size:clamp(28px,7vw,46px);
  margin:0 0 8px;
  color:var(--cream);
  text-shadow:0 2px 0 rgba(0,0,0,.3);
  letter-spacing:-.01em;
}
.hero-sub{
  color:var(--cream-dim);
  font-size:14px;
  margin-bottom:18px;
}
.hero-stats{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:6px;
}
.chip{
  background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 60%, #8a6a1e 100%);
  color:#2a1c05;
  border-radius:50%;
  width:74px;height:74px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px dashed rgba(42,28,5,.35);
  box-shadow:0 4px 10px var(--shadow), inset 0 0 0 4px rgba(255,255,255,.15);
  position:relative;
}
.chip .num{font-weight:900;font-size:17px;line-height:1;font-family:'Space Mono',monospace;}
.chip .lbl{font-size:8.5px;font-weight:700;margin-top:3px;letter-spacing:.02em;}

/* ===== Nav Tabs ===== */
.sticky-header-group{
  position:sticky; top:0; z-index:50;
}
nav.tabs{
  display:flex;
  overflow-x:auto;
  gap:6px;
  padding:10px 12px;
  background:rgba(10,30,22,.92);
  backdrop-filter:blur(6px);
  border-bottom:2px solid var(--rail);
  -ms-overflow-style:none; scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:0 0 auto;
  background:transparent;
  border:1.5px solid rgba(209,169,64,.35);
  color:var(--cream-dim);
  padding:8px 16px;
  border-radius:20px;
  font-family:'Heebo',sans-serif;
  font-weight:700;
  font-size:13.5px;
  cursor:pointer;
  transition:all .15s ease;
  white-space:nowrap;
}
.tab-btn:hover{border-color:var(--gold); color:var(--cream);}
.tab-btn.active{
  background:var(--gold);
  color:#2a1c05;
  border-color:var(--gold);
  box-shadow:0 2px 8px rgba(209,169,64,.4);
}

/* ===== Main ===== */
main{max-width:1100px; margin:0 auto; padding:22px 14px 10px;}
section.panel{display:none;}
section.panel.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.section-title{
  display:flex; align-items:center; gap:10px;
  font-size:20px; font-weight:900; margin:26px 0 14px;
  color:var(--gold-bright);
}
.section-title .suit{color:var(--gold); font-size:18px; opacity:.8;}
.section-title:first-child{margin-top:4px;}

.card{
  background:linear-gradient(180deg, var(--card-bg), rgba(15,50,36,.7));
  border:1px solid rgba(209,169,64,.25);
  border-radius:14px;
  padding:16px;
  margin-bottom:18px;
  box-shadow:0 6px 18px var(--shadow);
}
.card-note{
  font-size:12px; color:var(--cream-dim); margin-top:8px; line-height:1.6;
}

/* ===== Podium ===== */
.podium{
  direction:ltr;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:10px;
  padding:20px 6px 0;
  margin-bottom:18px;
}
.podium-slot{
  flex:1 1 0;
  max-width:130px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.podium-medal{font-size:26px; margin-bottom:4px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
.podium-name{
  font-size:12.5px; font-weight:700; color:var(--cream);
  margin-bottom:3px; line-height:1.3;
  overflow-wrap:break-word;
  min-height:2.6em;
  display:flex; align-items:flex-end; justify-content:center;
}
.podium-val{
  font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
  margin-bottom:8px;
}
.podium-block{
  width:100%;
  border-radius:8px 8px 0 0;
  display:flex; align-items:flex-start; justify-content:center;
  padding-top:8px;
  font-family:'Space Mono',monospace; font-weight:900;
  box-shadow:0 -2px 10px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.25);
  position:relative;
}
.podium-block span{font-size:20px;}
.block-1{
  height:96px;
  background:linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #8a6a1e);
  color:#2a1c05;
}
.block-2{
  height:70px;
  background:linear-gradient(180deg, #e2e2e2, #b8b8b8 55%, #7a7a7a);
  color:#242424;
}
.block-3{
  height:52px;
  background:linear-gradient(180deg, #d99a5c, #c17a3a 55%, #8a5525);
  color:#2a1505;
}
.slot-1{order:2;}
.slot-2{order:1;}
.slot-3{order:3;}
.slot-1 .podium-name{font-size:13.5px;}

/* ===== Hall of Fame ===== */
.fame-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.fame-row{
  display:flex; align-items:center; gap:12px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.18);
  border-inline-start:4px solid var(--felt-light);
}
.fame-row.top1{border-inline-start-color:var(--gold-bright); background:linear-gradient(90deg, rgba(209,169,64,.18), rgba(0,0,0,.18));}
.fame-row.top2{border-inline-start-color:#c9c9c9;}
.fame-row.top3{border-inline-start-color:#c98a4b;}
.fame-rank{
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:13px; font-family:'Space Mono',monospace;
  background:rgba(255,255,255,.08); color:var(--cream);
  flex:0 0 auto;
}
.fame-row.top1 .fame-rank{background:var(--gold-bright); color:#2a1c05;}
.fame-row.top2 .fame-rank{background:#c9c9c9; color:#222;}
.fame-row.top3 .fame-rank{background:#c98a4b; color:#2a1c05;}
.fame-name{flex:1; font-weight:700; font-size:15px;}
.fame-bar-wrap{flex:1; height:8px; background:rgba(255,255,255,.07); border-radius:4px; overflow:hidden; max-width:140px; display:none;}
.fame-val{font-family:'Space Mono',monospace; font-weight:700; font-size:14px; min-width:80px; text-align:left;}
.pos{color:var(--win);}
.neg{color:var(--loss);}

/* ===== Summary table ===== */
.table-scroll{overflow-x:auto; border-radius:10px; -webkit-overflow-scrolling:touch;}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:520px;}
table.wide{min-width:900px;}
thead th{
  background:var(--rail);
  color:var(--gold-bright);
  padding:8px 10px;
  font-weight:700;
  position:sticky; top:0;
  white-space:nowrap;
  border-bottom:2px solid var(--gold);
}
tbody td{
  padding:7px 10px;
  border-bottom:1px solid rgba(255,255,255,.06);
  white-space:nowrap;
}
tbody td.rowlabel{
  position:sticky; right:0;
  background:var(--felt);
  font-weight:700;
  color:var(--cream);
  z-index:2;
  border-inline-end:1px solid rgba(255,255,255,.1);
}
thead th.corner{position:sticky; right:0; z-index:3; background:var(--rail);}
tbody tr:hover td{background:rgba(255,255,255,.035);}
tbody tr:hover td.rowlabel{background:#1c4a34;}
td.num{font-family:'Space Mono',monospace; text-align:center;}
td.total-col{font-weight:700; background:rgba(209,169,64,.08);}
td.rank-col{font-weight:700; color:var(--gold-bright); text-align:center;}
.host-row td{font-size:11px; color:var(--cream-dim); font-style:italic;}

/* ===== Year picker chips ===== */
.year-chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
.year-chip{
  border:1.5px solid rgba(209,169,64,.35);
  color:var(--cream-dim);
  padding:6px 14px; border-radius:16px; font-size:12.5px; font-weight:700;
  cursor:pointer; background:transparent;
}
.year-chip.active{background:var(--gold); color:#2a1c05; border-color:var(--gold);}

/* ===== Chart wrap ===== */
.chart-wrap{position:relative; height:340px; width:100%; touch-action:pan-y;}
.chart-wrap.tall{height:420px;}
.chart-wrap.stats-chart{height:300px;}
.chart-toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
.period-select{
  background:rgba(0,0,0,.25); color:var(--cream); border:1.5px solid rgba(209,169,64,.4);
  border-radius:10px; padding:6px 10px; font-family:'Heebo',sans-serif; font-weight:700; font-size:12.5px;
  flex:1 1 auto; min-width:0; max-width:230px;
}
.zoom-hint{font-size:11px; color:var(--cream-dim); line-height:1.5; margin-bottom:10px;}
.reset-zoom-btn{
  border:1.5px solid rgba(209,169,64,.45); background:transparent; color:var(--gold-bright);
  padding:5px 12px; border-radius:14px; font-size:11.5px; font-weight:700; cursor:pointer;
  white-space:nowrap; flex:0 0 auto;
}
.reset-zoom-btn:hover{background:rgba(209,169,64,.12);}

/* ===== Player filter chips ===== */
.filter-bar{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
.filter-chip{
  border:1.5px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.04);
  color:var(--cream-dim);
  padding:4px 11px; border-radius:14px; font-size:11.5px; font-weight:600;
  cursor:pointer; display:flex; align-items:center; gap:5px; user-select:none;
}
.filter-chip .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
.filter-chip.off{opacity:.35;}
.filter-chip.off .dot{opacity:.4;}
.filter-toolbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;}
.filter-all-btns{display:flex; gap:6px; flex:0 0 auto;}
.filter-mini-btn{
  border:none; background:rgba(255,255,255,.08); color:var(--cream-dim);
  padding:4px 10px; border-radius:10px; font-size:10.5px; font-weight:700; cursor:pointer;
}
.filter-mini-btn:hover{background:rgba(255,255,255,.15);}
tr.row-hidden{display:none;}

/* ===== Awards tab ===== */
.awards-grid{display:grid; grid-template-columns:1fr; gap:14px;}
@media (min-width:700px){ .awards-grid{grid-template-columns:1fr 1fr;} }
.award-card{
  background:linear-gradient(160deg, rgba(209,169,64,.10), rgba(15,50,36,.6) 55%);
  border:1px solid rgba(209,169,64,.35);
  border-radius:14px;
  padding:16px 16px 14px;
  position:relative;
  overflow:hidden;
}
.award-card::before{
  content:attr(data-emoji);
  position:absolute; left:-6px; bottom:-16px;
  font-size:70px; opacity:.08; line-height:1;
}
.award-label{
  font-size:11px; letter-spacing:.06em; color:var(--gold);
  text-transform:uppercase; font-weight:700; margin-bottom:6px;
}
.award-name{font-size:17px; font-weight:900; color:var(--cream); margin-bottom:4px;}
.award-stat{font-family:'Space Mono',monospace; font-weight:700; font-size:15px; color:var(--gold-bright); margin-bottom:8px;}
.award-caption{font-size:12.5px; color:var(--cream-dim); line-height:1.6;}

.evo-card{
  background:rgba(0,0,0,.18); border:1px dashed rgba(209,169,64,.3);
  border-radius:12px; padding:12px 14px; margin-bottom:8px;
  font-size:13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.evo-old{color:var(--cream-dim); text-decoration:line-through; text-decoration-color:rgba(224,104,90,.6);}
.evo-arrow{color:var(--gold);}
.evo-new{color:var(--gold-bright); font-weight:700;}

/* ===== Rivalry finder cards ===== */
.rivalry-card{
  border-radius:12px; padding:16px 14px; margin-bottom:10px;
  background:rgba(0,0,0,.18);
}
.rivalry-card.rivalry{border:1px solid rgba(224,104,90,.4);}
.rivalry-card.duo{border:1px solid rgba(95,191,122,.35);}
.rivalry-label{font-size:12px; font-weight:800; color:var(--gold-bright); margin-bottom:10px; text-align:center;}
.rivalry-row{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px;}
.rivalry-name{flex:1; font-weight:800; font-size:13.5px; color:var(--cream); text-align:center;}
.rivalry-vs{
  flex:0 0 auto; font-size:13px; font-weight:900;
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
}
.rivalry-card.rivalry .rivalry-vs{ color:var(--loss); background:rgba(224,104,90,.15); border:2px solid rgba(224,104,90,.5); }
.rivalry-card.duo .rivalry-vs{ color:var(--win); background:rgba(95,191,122,.15); border:2px solid rgba(95,191,122,.5); }
.rivalry-caption{font-size:12px; color:var(--cream-dim); line-height:1.6; text-align:center;}

/* ===== Admin seed panel ===== */
.admin-card{border:1px dashed rgba(224,104,90,.4); background:rgba(224,104,90,.05);}
.admin-card .section-title{color:#e0685a;}
.seed-btn{
  background:linear-gradient(180deg, var(--gold-bright), var(--gold));
  color:#2a1c05; border:none; border-radius:10px; padding:10px 18px;
  font-weight:900; font-size:13.5px; cursor:pointer; font-family:'Heebo',sans-serif;
}
.seed-btn:disabled{opacity:.5; cursor:not-allowed;}
.seed-log{
  margin-top:12px; background:rgba(0,0,0,.3); border-radius:8px; padding:10px 12px;
  font-family:'Space Mono',monospace; font-size:11px; color:var(--cream-dim);
  max-height:200px; overflow-y:auto; white-space:pre-wrap; direction:ltr; text-align:left;
}

/* ===== Session forms ===== */
.form-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
.form-row label{font-size:12.5px; font-weight:700; color:var(--cream-dim); min-width:60px;}
.form-row input[type="date"], .form-row select{
  flex:1; min-width:140px;
  background:rgba(0,0,0,.25); color:var(--cream); border:1.5px solid rgba(209,169,64,.4);
  border-radius:8px; padding:7px 10px; font-family:'Heebo',sans-serif; font-size:13px;
}
.players-check-grid{
  display:flex; flex-direction:column; gap:5px; margin:10px 0;
  max-height:320px; overflow-y:auto; padding-right:2px;
}
.player-check-row{
  display:flex; align-items:center; gap:8px;
  background:rgba(0,0,0,.15); border-radius:8px; padding:6px 8px;
}
.player-check-row input[type="checkbox"]{ width:17px; height:17px; flex:0 0 auto; accent-color:var(--gold); }
.player-check-row .pname{flex:1; font-size:12.5px; color:var(--cream); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.player-check-row input[type="number"]{
  width:78px; background:rgba(0,0,0,.3); color:var(--cream); border:1px solid rgba(255,255,255,.15);
  border-radius:6px; padding:5px 6px; font-family:'Space Mono',monospace; font-size:12.5px; text-align:center;
  visibility:hidden;
}
.player-check-row.checked input[type="number"]{ visibility:visible; }
.add-player-row{display:flex; gap:8px; margin:12px 0; align-items:center;}
.add-player-row input[type="text"]{
  flex:1; background:rgba(0,0,0,.25); color:var(--cream); border:1.5px solid rgba(209,169,64,.4);
  border-radius:8px; padding:7px 10px; font-family:'Heebo',sans-serif; font-size:13px;
}
.mini-action-btn{
  border:1.5px solid rgba(209,169,64,.5); background:transparent; color:var(--gold-bright);
  padding:7px 14px; border-radius:8px; font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap;
}
.player-search{
  display:block; width:100%; box-sizing:border-box;
  background:rgba(0,0,0,.25); color:var(--cream); border:1.5px solid rgba(209,169,64,.4);
  border-radius:8px; padding:8px 12px; font-family:'Heebo',sans-serif; font-size:13px;
  margin-bottom:8px;
}
.player-search::placeholder{color:var(--cream-dim);}
.running-total{
  font-family:'Space Mono',monospace; font-weight:900; font-size:16px; text-align:center;
  padding:10px; border-radius:8px; margin:12px 0; background:rgba(0,0,0,.2);
}
.running-total.balanced{color:var(--win);}
.running-total.unbalanced{color:var(--loss);}
.danger-btn{
  background:linear-gradient(180deg, #e08070, #c14a3a);
  color:#fff; border:none; border-radius:10px; padding:10px 18px;
  font-weight:900; font-size:13.5px; cursor:pointer; font-family:'Heebo',sans-serif;
}
.danger-btn:disabled{opacity:.5; cursor:not-allowed;}

/* sign toggle (mobile number inputs often have no minus key) */
.player-check-row input[type="number"]{ visibility:hidden; -moz-appearance:textfield; }
.sign-toggle{
  width:28px; height:28px; border-radius:6px; border:1.5px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06); color:var(--cream); font-weight:900; font-size:15px;
  cursor:pointer; flex:0 0 auto; visibility:hidden; line-height:1;
}
.player-check-row.checked .sign-toggle{ visibility:visible; }
.sign-toggle.neg{ background:rgba(224,104,90,.25); border-color:rgba(224,104,90,.6); color:var(--loss); }
.sign-toggle.pos{ background:rgba(95,191,122,.2); border-color:rgba(95,191,122,.6); color:var(--win); }

/* action bar (top, always visible) */
.action-bar{
  display:flex; gap:8px; padding:10px 14px; justify-content:center;
  background:rgba(10,30,22,.92); border-bottom:2px solid rgba(209,169,64,.25);
}
.action-bar-btn{
  flex:1; max-width:220px; border:none; border-radius:10px; padding:10px 12px;
  font-weight:800; font-size:13px; cursor:pointer; font-family:'Heebo',sans-serif;
}
.action-bar-btn.add{ background:linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#2a1c05; }
.action-bar-btn.delete{ background:linear-gradient(180deg, #e08070, #c14a3a); color:#fff; }

/* modal */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.72);
  z-index:1000; justify-content:center; padding:16px; overflow-y:auto;
}
.modal-overlay.open{ display:flex; }
.modal-box{
  background:linear-gradient(180deg, var(--felt-light), var(--felt-dark));
  border:1px solid rgba(209,169,64,.45); border-radius:16px; padding:20px 16px 16px;
  max-width:480px; width:100%; position:relative; margin-top:24px; height:fit-content;
  box-shadow:0 12px 40px rgba(0,0,0,.55);
}
.modal-close{
  position:absolute; top:12px; left:12px; background:rgba(255,255,255,.12); border:none;
  color:var(--cream); width:30px; height:30px; border-radius:50%; font-size:17px; cursor:pointer; line-height:1;
}
.modal-title{font-size:16.5px; font-weight:900; color:var(--gold-bright); margin-bottom:14px; padding-left:38px;}

/* clickable player names */
.player-link{cursor:pointer; text-decoration:underline; text-decoration-color:rgba(209,169,64,.35); text-underline-offset:2px;}
.player-link:hover{color:var(--gold-bright); text-decoration-color:var(--gold-bright);}

/* player profile modal */
.profile-box{max-width:440px;}
.profile-header{text-align:center; margin-bottom:16px;}
.profile-medal{font-size:32px; margin-bottom:4px;}
.profile-name{font-size:19px; font-weight:900; color:var(--cream);}
.profile-rank{font-size:12px; color:var(--cream-dim); margin-top:2px;}
.profile-blurb{
  background:rgba(209,169,64,.08); border-right:3px solid var(--gold);
  border-radius:8px; padding:12px 14px; margin-bottom:16px;
  font-size:13px; line-height:1.7; color:var(--cream); font-style:italic;
}
.profile-stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
.profile-stat{background:rgba(0,0,0,.2); border-radius:10px; padding:12px 8px; text-align:center;}
.profile-stat-val{font-family:'Space Mono',monospace; font-weight:800; font-size:15px; color:var(--cream); margin-bottom:3px;}
.profile-stat-lbl{font-size:10.5px; color:var(--cream-dim);}
.profile-awards-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.profile-award-pill{
  background:rgba(209,169,64,.12); border:1px solid rgba(209,169,64,.35); color:var(--gold-bright);
  border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:700;
}

/* ===== Footer ===== */
footer{
  text-align:center; color:var(--cream-dim); font-size:11.5px;
  padding:30px 16px 10px; opacity:.7;
}
footer .suit-row{letter-spacing:10px; color:var(--gold); opacity:.5; margin-bottom:8px; font-size:16px;}

/* legend dots */
.legend-note{display:flex; align-items:center; gap:14px; font-size:12px; color:var(--cream-dim); margin-bottom:10px; flex-wrap:wrap;}
.legend-dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-inline-end:5px; vertical-align:middle;}

@media (max-width:600px){
  .chip{width:64px;height:64px;}
  .chip .num{font-size:14px;}
  .section-title{font-size:17px;}
}
</style>

<script>
(function(){
  let DATA = JSON.parse(document.getElementById('poker-data').textContent);
  function getYears(){ return Object.keys(DATA.years).sort((a,b)=>a-b); }
  function getYearsDesc(){ return getYears().reverse(); }

  const PALETTE = [
    '#d1a940','#5fbf7a','#e0685a','#5aa9e0','#c98a4b','#9b7fd1',
    '#e0b45a','#4fd1c5','#e05a9c','#8ac95a','#c9c9c9','#5ad1a0',
    '#d15a5a','#5a7fd1','#d19b5a','#7fd15a'
  ];

  // Stable per-player colors: assigned once from a fixed, deterministic
  // ordering of every known player name. Deliberately uses overall_chart's
  // row order (roughly "when they joined the group" / Firestore doc-ID
  // order) rather than the leaderboard's rank order — rank shifts every
  // time someone wins or loses, which would reshuffle everyone's color.
  // This way a player keeps the same color across every chart and period,
  // and it stays stable over time as new sessions come in.
  let PLAYER_COLOR_MAP = {};
  function rebuildColorMap(){
    const ordered = [];
    const seen = new Set();
    (DATA.overall_chart||[]).slice(1).forEach(row=>{
      const name = row[0];
      if(name && !seen.has(name)){ seen.add(name); ordered.push(name); }
    });
    (DATA.leaderboard||[]).forEach(([name])=>{ if(!seen.has(name)){ seen.add(name); ordered.push(name); } });
    PLAYER_COLOR_MAP = {};
    ordered.forEach((name,i)=>{ PLAYER_COLOR_MAP[name] = PALETTE[i % PALETTE.length]; });
  }
  function hashColor(str){
    let h = 0;
    for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
    return PALETTE[Math.abs(h) % PALETTE.length];
  }
  function colorFor(name){
    return PLAYER_COLOR_MAP[name] || hashColor(name);
  }

  function fmt(n){
    if(n===null || n===undefined || n==='') return '';
    const v = Math.round(n);
    const s = Math.abs(v).toLocaleString('en-US');
    return (v<0? '-' : (v>0? '+':'')) + s;
  }
  function numClass(n){
    if(n===null||n===undefined||n==='') return '';
    return n>0?'pos':(n<0?'neg':'');
  }

  // register zoom plugin defensively (UMD build usually self-registers, but
  // some CDN builds expose it as a named global instead of auto-registering)
  try{
    if(window.Chart && window.ChartZoom && Chart.registry && !Chart.registry.plugins.get('zoom')){
      Chart.register(window.ChartZoom);
    }
  }catch(e){}

  // ---------- Hero stats ----------
  function buildHeroStats(){
    const el = document.getElementById('heroStats');
    const totalSessions = DATA.total_sessions || 0;
    const numPlayers = DATA.leaderboard.length;
    const span = `${DATA.years_span[0]}–${DATA.years_span[1]}`;
    const stats = [
      {num: totalSessions, lbl:'מפגשים'},
      {num: numPlayers, lbl:'שחקנים'},
      {num: getYears().length, lbl:'עונות'},
      {num: span, lbl:'טווח שנים', small:true},
    ];
    el.innerHTML = stats.map(s=>`
      <div class="chip">
        <div class="num" style="${s.small?'font-size:12px':''}">${s.num}</div>
        <div class="lbl">${s.lbl}</div>
      </div>
    `).join('');
  }

  // ---------- Tabs ----------
  function buildTabs(){
    const nav = document.getElementById('tabNav');
    const tabs = [
      {id:'summary', label:'🏆 סיכום'},
      {id:'awards', label:'🏅 פרסים'},
      {id:'stats', label:'📊 מספרים'},
      {id:'chart', label:'📈 גרף'},
    ];
    nav.innerHTML = tabs.map((t,i)=>`<button class="tab-btn ${i===0?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
    nav.addEventListener('click', e=>{
      const btn = e.target.closest('.tab-btn');
      if(!btn) return;
      showTab(btn.dataset.tab);
    });
  }

  function showTab(id){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
    document.querySelectorAll('section.panel').forEach(s=>s.classList.toggle('active', s.id===id));
    if(id==='chart') activateChart();
    if(id==='stats') activateStatsCharts();
    window.scrollTo({top: document.querySelector('nav.tabs').offsetTop, behavior:'instant'});
  }

  // ---------- Summary panel ----------
  function buildSummaryPanel(){
    const main = document.getElementById('mainContent');
    const sec = document.createElement('section');
    sec.className = 'panel active';
    sec.id = 'summary';

    const lb = DATA.leaderboard;
    const top3 = lb.slice(0,3);
    const rest = lb.slice(3);

    const PODIUM_ORDER = [2,1,3]; // visual left-to-right: 2nd, 1st, 3rd
    const PODIUM_MEDAL = {1:'🥇', 2:'🥈', 3:'🥉'};
    const podiumHtml = PODIUM_ORDER.map(rank=>{
      const row = top3[rank-1];
      if(!row) return '';
      const [name, val] = row;
      return `<div class="podium-slot slot-${rank}">
        <div class="podium-medal">${PODIUM_MEDAL[rank]}</div>
        <div class="podium-name">${playerLink(name)}</div>
        <div class="podium-val ${numClass(val)}">${fmt(val)} ₪</div>
        <div class="podium-block block-${rank}"><span>${rank}</span></div>
      </div>`;
    }).join('');

    let fameHtml = rest.map((row,i)=>{
      const [name, val] = row;
      return `<li class="fame-row">
        <div class="fame-rank">${i+4}</div>
        <div class="fame-name">${playerLink(name)}</div>
        <div class="fame-val ${numClass(val)}">${fmt(val)} ₪</div>
      </li>`;
    }).join('');

    const s = DATA.summary;
    const yearHeader = s[2].slice(2).filter(v=>v!==null && v!==undefined);
    const rankRows = s.filter(r => typeof r[1] === 'number');
    const marginRow = s.find(r => r[1] === 'מקום ראשון שנתי');

    let summaryTableHtml = `<div class="table-scroll"><table class="wide">
      <thead><tr><th class="corner">מקום</th>${yearHeader.map(y=>`<th>${y}</th>`).join('')}</tr></thead>
      <tbody>
        ${rankRows.map(r=>{
          const rank = r[1];
          const vals = r.slice(2, 2+yearHeader.length);
          return `<tr><td class="rowlabel">${rank}</td>${vals.map(v=>`<td class="num">${v?playerLink(v):''}</td>`).join('')}</tr>`;
        }).join('')}
        ${marginRow?`<tr><td class="rowlabel">מרווח זכייה 🥇</td>${marginRow.slice(2,2+yearHeader.length).map(v=>`<td class="num total-col">${v!=null?fmt(v)+' ₪':''}</td>`).join('')}</tr>`:''}
      </tbody>
    </table></div>`;

    sec.innerHTML = `
      <div class="section-title"><span class="suit">♦</span> היכל התהילה — מצטבר כל הזמנים</div>
      <div class="card">
        <div class="podium">${podiumHtml}</div>
        <ul class="fame-list">${fameHtml}</ul>
        <div class="card-note">סה"כ רווח/הפסד נטו של כל שחקן על פני כל המשחקים שנרשמו (${DATA.total_sessions} מפגשים, ${DATA.years_span[0]}–${DATA.years_span[1]}). לגרף התקדמות — טאב "גרף".</div>
      </div>

      <div class="section-title"><span class="suit">♣</span> טבלת אלופים — כל השנים</div>
      <div class="card">
        ${summaryTableHtml}
        <div class="card-note">שורות 1–6: השחקנים המובילים בכל עונה (לפי דירוג שנתי). שורת "מרווח זכייה" מציגה את גובה ההפרש של המקום הראשון באותה שנה.</div>
      </div>
    `;
    main.appendChild(sec);
  }

  // ---------- Awards panel ----------
  const AWARD_META = {
    top_earner: {emoji:'👑', label:'האלוף הכל-זמנים', caption: (a)=>`${fmt(a.value)} ₪ נטו על פני כל ההיסטוריה. הקלפים פשוט אוהבים אותו.`},
    top_donor: {emoji:'💸', label:'התורם הרשמי של המועדון', caption: (a)=>`${fmt(a.value)} ₪ נטו. בלעדיו הקופה הזו לא הייתה קיימת — תודו לו בפעם הבאה.`},
    most_dedicated: {emoji:'🏃', label:'הכי מסור', caption: (a)=>`${a.value} מפגשים על פני ${a.extra} שנים. יש חיים מחוץ לשולחן? כנראה שלא.`},
    best_winrate: {emoji:'🎯', label:'אחוז הניצחונות הגבוה ביותר', caption: (a)=>`${a.value}% ניצחונות מתוך ${a.extra} מפגשים. פשוט לא מפסיד.`},
    worst_winrate: {emoji:'🥶', label:'אחוז הניצחונות הנמוך ביותר', caption: (a)=>`${a.value}% בלבד מתוך ${a.extra} מפגשים. ובכל זאת חוזר כל שבוע. יש כאן משהו פסיכולוגי.`},
    biggest_win: {emoji:'💥', label:'הזכייה הגדולה בהיסטוריה', caption: (a)=>`${fmt(a.value)} ₪ במפגש אחד. מישהו קם מהשולחן הזה מחייך עד האוזניים.`},
    biggest_loss: {emoji:'📉', label:'ההפסד הגדול בהיסטוריה', caption: (a)=>`${fmt(a.value)} ₪ במפגש אחד. יום רע בעבודה זה כלום לעומת זה.`},
    most_volatile: {emoji:'🎢', label:'הכי לא יציב', caption: (a)=>`סטיית תקן של כ-${a.value} ₪ למפגש. אף פעם לא יודעים אם הוא יוצא עם חיוך או עם עוד סיפור.`},
  };

  // ---------- Rivalry finder: pairwise correlation of session results ----------
  // (computed client-side, same as the player-stats functions, so it works
  // identically for baseline and live Firestore data)
  function pearson(xs, ys){
    const n = xs.length;
    const mx = xs.reduce((a,b)=>a+b,0)/n;
    const my = ys.reduce((a,b)=>a+b,0)/n;
    let cov=0, vx=0, vy=0;
    for(let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; cov+=dx*dy; vx+=dx*dx; vy+=dy*dy; }
    if(vx===0 || vy===0) return 0;
    return cov/Math.sqrt(vx*vy);
  }

  function computeRivalryFinder(){
    const years = getYears();
    const timeline = []; // array of {name: value} maps, one per session, chronological
    years.forEach(y=>{
      const table = DATA.years[y].table;
      const dateRow = table[1];
      const totalIdx = dateRow.findIndex(v=>v==='סה"כ');
      const dateCols = dateRow.slice(1, totalIdx>0?totalIdx:undefined);
      const playerRows = table.slice(2).filter(r=>r[0]!=='סה"כ' && r[0]!=='סה"כ יומי');
      dateCols.forEach((d, colIdx)=>{
        const m = {};
        playerRows.forEach(r=>{
          const v = r[1+colIdx];
          if(v!==null && v!==undefined && v!==0) m[canonicalName(r[0])] = v;
        });
        timeline.push(m);
      });
    });

    const allNames = Array.from(new Set(timeline.flatMap(m=>Object.keys(m)))).filter(n=>!/^אורח/.test(n));
    const MIN_SHARED = 30;
    let bestRivalry = null, bestDuo = null; // ranked by |t-statistic| (significance), not raw r

    for(let i=0;i<allNames.length;i++){
      for(let j=i+1;j<allNames.length;j++){
        const a=allNames[i], b=allNames[j];
        const xs=[], ys=[];
        timeline.forEach(m=>{ if(a in m && b in m){ xs.push(m[a]); ys.push(m[b]); } });
        const n = xs.length;
        if(n < MIN_SHARED) continue;
        const r = pearson(xs, ys);
        if(Math.abs(r) >= 0.999) continue;
        const t = r * Math.sqrt((n-2)/(1-r*r));
        if(r < 0 && (!bestRivalry || t < bestRivalry.t)) bestRivalry = {a, b, r, n, t};
        if(r > 0 && (!bestDuo || t > bestDuo.t)) bestDuo = {a, b, r, n, t};
      }
    }
    return {bestRivalry, bestDuo};
  }

  // ---------- Player stats tab: sessions, wins, win%, streaks ----------
  // Computed client-side from DATA.years table data (works identically for
  // the static baseline and for live Firestore-derived data, since both
  // share the same table shape) — no separate Python-side prep needed.
  function computeAllPlayerStats(){
    const stats = {}; // canonical name -> {sessions, wins, losses, events:['W'/'L',...]}
    getYears().forEach(y=>{
      const table = DATA.years[y].table;
      const dateRow = table[1];
      const totalIdx = dateRow.findIndex(v=>v==='סה"כ');
      const playerRows = table.slice(2).filter(r=>r[0]!=='סה"כ' && r[0]!=='סה"כ יומי');
      playerRows.forEach(r=>{
        const canon = canonicalName(r[0]);
        const vals = r.slice(1, totalIdx>0?totalIdx:undefined);
        const s = stats[canon] || (stats[canon] = {sessions:0, wins:0, losses:0, events:[]});
        vals.forEach(v=>{
          if(v!==null && v!==undefined && v!==0){
            s.sessions++;
            if(v>0){ s.wins++; s.events.push('W'); }
            else { s.losses++; s.events.push('L'); }
          }
        });
      });
    });

    Object.values(stats).forEach(s=>{
      let longestWin=0, longestLoss=0, curWin=0, curLoss=0;
      s.events.forEach(e=>{
        if(e==='W'){ curWin++; curLoss=0; longestWin=Math.max(longestWin,curWin); }
        else { curLoss++; curWin=0; longestLoss=Math.max(longestLoss,curLoss); }
      });
      s.longestWinStreak = longestWin;
      s.longestLossStreak = longestLoss;
      let i = s.events.length-1;
      const type = s.events[i];
      let count = 0;
      while(i>=0 && s.events[i]===type){ count++; i--; }
      s.currentStreak = s.events.length ? count : 0;
      s.currentStreakType = type || null;
    });

    return stats;
  }

        },
        scales:{
          x:{ ticks:{color:'#c9bfa9', font:{size:11}}, grid:{display:false} },
          y:{ beginAtZero:true, ticks:{color:'#c9bfa9', font:{size:10}}, grid:{color:'rgba(255,255,255,.07)'} }

    // wins
    const byWins = names.slice().sort((a,b)=> stats[b].wins - stats[a].wins);
    document.getElementById('winsChart').parentElement.style.height = Math.max(240, byWins.length*rowHeight) + 'px';
    statsCharts.wins = new Chart(document.getElementById('winsChart').getContext('2d'), {

        borderRadius:4,
      }]},
      options: makeHorizontalBarOptions(' ניצחונות')
    });

    // win rate — diverging from 50% (the coin-flip baseline): bar length is
    // the delta from 50, green above / red below, so "who's actually good"
    // reads at a glance instead of everyone's bar starting at zero.
    const byRate = names.slice().sort((a,b)=> (stats[b].wins/stats[b].sessions) - (stats[a].wins/stats[a].sessions));
    const winPcts = byRate.map(n=> Math.round(stats[n].wins/stats[n].sessions*1000)/10);
    const deltas = winPcts.map(p=> Math.round((p-50)*10)/10);
    document.getElementById('winrateChart').parentElement.style.height = Math.max(240, byRate.length*rowHeight) + 'px';
    statsCharts.winrate = new Chart(document.getElementById('winrateChart').getContext('2d'), {
      type:'bar',
      data:{ labels: byRate, datasets:[{
        data: deltas,
        backgroundColor: deltas.map(d=> d>0 ? '#5fbf7a' : (d<0 ? '#e0685a' : '#d1a940')),
        borderRadius:4,
        minBarLength: 3, // exactly-50% players still get a small visible sliver
      }]},
      options:{
        indexAxis:'y',
        responsive:true, maintainAspectRatio:false,
        onClick:(evt, elements, chart)=>{
          if(evt.x >= chart.chartArea.left) return;
          const points = chart.getElementsAtEventForMode(evt, 'nearest', {intersect:false, axis:'y'}, true);
          if(points.length) openPlayerProfile(chart.data.labels[points[0].index]);
        },
        onHover:(evt, elements, chart)=>{
          chart.canvas.style.cursor = (evt.x < chart.chartArea.left) ? 'pointer' : 'default';
        },
        plugins:{
          legend:{display:false},
          tooltip:{
            rtl:true, titleFont:{size:11}, bodyFont:{size:11},

          }

          x:{

            grid:{color:'rgba(255,255,255,.07)'}
          },
          y:{ ticks:{color:'#c9bfa9', font:{size:10.5}}, grid:{display:false} }
        }
      }
    });

    // current streaks (signed: +win streak, -loss streak), only players with an active streak >= 2
    const streakNames = names.filter(n=> stats[n].currentStreak >= 2);
    const byStreak = streakNames.slice().sort((a,b)=>{
      const va = stats[a].currentStreakType==='W' ? stats[a].currentStreak : -stats[a].currentStreak;
      const vb = stats[b].currentStreakType==='W' ? stats[b].currentStreak : -stats[b].currentStreak;
      return vb - va;
    });
    document.getElementById('streaksChart').parentElement.style.height = Math.max(240, byStreak.length*rowHeight) + 'px';
    statsCharts.streaks = new Chart(document.getElementById('streaksChart').getContext('2d'), {
      type:'bar',
      data:{ labels: byStreak, datasets:[{
        data: byStreak.map(n=> stats[n].currentStreakType==='W' ? stats[n].currentStreak : -stats[n].currentStreak),
        backgroundColor: byStreak.map(n=> stats[n].currentStreakType==='W' ? '#5fbf7a' : '#e0685a'),
        borderRadius:4,
      }]},
      options: makeHorizontalBarOptions(' מפגשים ברצף')
    });

    // current attendance streak — how many sessions in a row (through the
    // most recent one recorded) each player has NOT missed, regardless of
    // whether they won or lost. Requires the full session timeline (every
    // date, whether or not a given player played it) to detect gaps
    // correctly, unlike the win/loss streaks above which only look at a
    // player's own played sessions.
    const timeline = [];
    years.forEach(y=>{
      const table = DATA.years[y].table;
      const dateRow = table[1];
      const totalIdx = dateRow.findIndex(v=>v==='סה"כ');
      const dateCols = dateRow.slice(1, totalIdx>0?totalIdx:undefined);
      const playerRows = table.slice(2).filter(r=>r[0]!=='סה"כ' && r[0]!=='סה"כ יומי');
      dateCols.forEach((d, colIdx)=>{
        const attendees = new Set();
        playerRows.forEach(r=>{
          const v = r[1+colIdx];
          if(v!==null && v!==undefined && v!==0) attendees.add(canonicalName(r[0]));
        });
        timeline.push(attendees);
      });
    });
    const attendanceStreak = {};
    names.forEach(name=>{
      let current = 0;
      for(let i=timeline.length-1; i>=0; i--){
        if(timeline[i].has(name)) current++;
        else break;
      }
      attendanceStreak[name] = current;
    });
    const attendanceNames = names.filter(n=>attendanceStreak[n]>=2).sort((a,b)=> attendanceStreak[b]-attendanceStreak[a]);
    document.getElementById('attendanceChart').parentElement.style.height = Math.max(240, attendanceNames.length*rowHeight) + 'px';
    statsCharts.attendance = new Chart(document.getElementById('attendanceChart').getContext('2d'), {
      type:'bar',
      data:{ labels: attendanceNames, datasets:[{
        data: attendanceNames.map(n=>attendanceStreak[n]),
        backgroundColor: attendanceNames.map(n=>colorFor(n)),
        borderRadius:4,
      }]},
      options: makeHorizontalBarOptions(' מפגשים ברצף')
    });

    // result histogram — every individual session result, across every
    // player and every year, bucketed into ₪100 ranges
    const allVals = [];
    years.forEach(y=>{
      const table = DATA.years[y].table;
      const dateRow = table[1];
      const totalIdx = dateRow.findIndex(v=>v==='סה"כ');
      const playerRows = table.slice(2).filter(r=>r[0]!=='סה"כ' && r[0]!=='סה"כ יומי');
      playerRows.forEach(r=>{
        const vals = r.slice(1, totalIdx>0?totalIdx:undefined);
        vals.forEach(v=>{ if(v!==null && v!==undefined && v!==0) allVals.push(v); });
      });
    });
    const binWidth = 100;
    const minV = Math.min(...allVals), maxV = Math.max(...allVals);
    const start = Math.floor(minV/binWidth)*binWidth;
    const end = Math.ceil(maxV/binWidth)*binWidth;
    const bins = [];
    for(let b=start; b<end; b+=binWidth) bins.push({lo:b, hi:b+binWidth, count:0});
    allVals.forEach(v=>{
      let idx = Math.floor((v-start)/binWidth);
      idx = Math.max(0, Math.min(bins.length-1, idx));
      bins[idx].count++;
    });
    const histLabels = bins.map(b=> `${b.lo} עד ${b.hi}`);
    statsCharts.histogram = new Chart(document.getElementById('histogramChart').getContext('2d'), {
      type:'bar',
      data:{ labels: histLabels, datasets:[{
        label:'מספר מפגשים',
        data: bins.map(b=>b.count),
        backgroundColor: bins.map(b=> (b.lo+b.hi)/2 >= 0 ? '#5fbf7a' : '#e0685a'),
        borderRadius:3,
      }]},
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{ rtl:true, titleFont:{size:11}, bodyFont:{size:11}, callbacks:{ label: ctx=>`${ctx.parsed.y} פעמים` } }
        },
        scales:{
          x:{ ticks:{color:'#c9bfa9', font:{size:8.5}, maxRotation:75, minRotation:75, autoSkip:true, maxTicksLimit:22}, grid:{display:false} },
          y:{ beginAtZero:true, ticks:{color:'#c9bfa9', font:{size:10}}, grid:{color:'rgba(255,255,255,.07)'} }
        }
      }
    });
  }

        </div>
      </div>
      <div class="filter-bar"></div>
    `;
    const bar = containerEl.querySelector('.filter-bar');
    const state = {};
    items.forEach(label=>{ state[label] = true; });

    function applyVisibility(label){
      const visible = state[label];
      const chart = getChart();
      if(chart){
        const idx = chart.data.datasets.findIndex(d=>d.label===label);
        if(idx>=0){ chart.setDatasetVisibility(idx, visible); }
      }
    }

    function render(){
      bar.innerHTML = items.map((label,i)=>{
        const on = state[label];
        return `<button type="button" class="filter-chip ${on?'':'off'}" data-idx="${i}">
          <span class="dot" style="background:${colorFor(label)}"></span>${label}
        </button>`;
      }).join('');
    }
    render();

    bar.addEventListener('click', e=>{
      const btn = e.target.closest('.filter-chip');
      if(!btn) return;
      const label = items[+btn.dataset.idx];
      const allVisible = items.every(l => state[l]);
      if(allVisible){
        // starting from "all shown": isolate — show only the clicked one
        items.forEach(l => { state[l] = (l === label); });
      } else {
        // already filtered: plain add/remove toggle
        state[label] = !state[label];
      }
      if(items.every(l => !state[l])){
        // deselecting the last one resets back to "all shown"
        items.forEach(l => { state[l] = true; });
      }
      render();
      items.forEach(applyVisibility);
      const chart = getChart();
      if(chart) chart.update();
    });

    containerEl.querySelector('[data-act="all"]').addEventListener('click', ()=>{
      items.forEach(label=>{ state[label]=true; });
      render();
      items.forEach(applyVisibility);
      const chart = getChart();
      if(chart) chart.update();
    });
    containerEl.querySelector('[data-act="none"]').addEventListener('click', ()=>{
      items.forEach(label=>{ state[label]=false; });
      render();
      items.forEach(applyVisibility);
      const chart = getChart();
      if(chart) chart.update();
    });
  }

  function downsample(labels, seriesArr, maxPoints){
    const n = labels.length;
    if(n <= maxPoints) return {labels, seriesArr};
    const step = Math.ceil(n / maxPoints);
    const newLabels = [];
    const newSeries = seriesArr.map(()=>[]);
    for(let i=0;i<n;i+=step){
      newLabels.push(labels[i]);
      seriesArr.forEach((s,si)=> newSeries[si].push(s[i]));
    }
    if((n-1) % step !== 0){
      newLabels.push(labels[n-1]);
      seriesArr.forEach((s,si)=> newSeries[si].push(s[n-1]));
    }
    return {labels:newLabels, seriesArr:newSeries};
  }

  function getChartDataForPeriod(period){
    if(period === 'all'){

      const labels = chart[0].slice(1);
      const rows = chart.slice(1);
      const seriesArr = rows.map(r=>r.slice(1).map(v=> v===null||v===undefined? null : v));
      const ds = downsample(labels, seriesArr, 180);
      return {
        labels: ds.labels,
        datasets: rows.map((r,i)=>({
          label: r[0], data: ds.seriesArr[i],
          borderColor: colorFor(r[0]), backgroundColor: colorFor(r[0]),
          borderWidth: 1.8, pointRadius: 0, tension:.15, spanGaps:true,
        })),
      };
    }
    const obj = DATA.years[period];
    const chart = obj.chart;
    const labels = chart[0].slice(1);
    const rows = chart.slice(1).filter(r=>r.slice(1).some(v=>v!==null && v!==undefined));
    return {
      labels,
      datasets: rows.map((r,i)=>({
        label: r[0], data: r.slice(1),
        borderColor: colorFor(r[0]), backgroundColor: colorFor(r[0]),
        borderWidth: 2, pointRadius: 0, tension:.2, spanGaps:true,
      })),
    };
  }

  // Reads the chart's currently-visible x-axis index range and re-renders
  // the table below it to match (full range if not zoomed, hidden entirely
  // for the all-time period).
  function syncTableToChart(){
    const cardEl = document.getElementById('chartTableCard');
    const wrapEl = document.getElementById('chartTableWrap');
    if(!cardEl || !wrapEl) return;

    if(currentPeriod === 'all' || !chartInstance){
      cardEl.style.display = 'none';
      wrapEl.innerHTML = '';
      return;
    }
    cardEl.style.display = '';

    let range = null;
    const xScale = chartInstance.scales && chartInstance.scales.x;
    const labelCount = chartInstance.data.labels.length;
    if(xScale && typeof xScale.min === 'number' && typeof xScale.max === 'number'){
      const start = Math.max(0, Math.round(xScale.min));
      const end = Math.min(labelCount-1, Math.round(xScale.max));
      if(start > 0 || end < labelCount-1){
        range = {start, end};
      }
    }
    wrapEl.innerHTML = renderYearTableHtml(currentPeriod, range);
  }

  function renderChartPeriod(period){
    const data = getChartDataForPeriod(period);
    // Destroy and fully recreate the chart on every period switch. Mutating
    // an existing instance's data in place can leave the zoom plugin's
    // cached scale range from the previous (differently-sized) dataset,
    // which can hide or squash points on the newly selected period.
    if(chartInstance){
      chartInstance.destroy();
      chartInstance = null;
    }
    const ctx = document.getElementById('mainCanvas').getContext('2d');
    chartInstance = new Chart(ctx, {
      type:'line',
      data:{labels:data.labels, datasets:data.datasets},
      options: baseChartOptions(()=>syncTableToChart())
    });
    chartBuilt = true;

    const labels = data.datasets.map(d=>d.label);
    buildFilterBar(document.getElementById('chartFilterBar'), labels, ()=>chartInstance);

        : `נתוני עונת ${period}. זומו לתוך הגרף כדי לסנן גם את הטבלה למטה.`;

  // ---------- Year table renderer (shared, used inside the graph tab) ----------
  // `range`, if given, is {start, end} inclusive indices into the date columns —
  // used to filter the table to whatever's currently zoomed-in on the chart.
  // Totals/rank always reflect the full season regardless of range.
  function renderYearTableHtml(year, range){
    const obj = DATA.years[year];
    const table = obj.table;
    const hostRow = table[0];
    const dateRow = table[1];
    const playerRows = table.slice(2).filter(r => r[0] !== 'סה"כ' && r[0] !== 'סה"כ יומי');
    const totalIdx = dateRow.findIndex(v=>v==='סה"כ');
    const rankIdx = dateRow.findIndex(v=>v==='דירוג');
    const fullDateCols = dateRow.slice(1, totalIdx>0?totalIdx:undefined);

    const start = range ? Math.max(0, Math.min(range.start, fullDateCols.length-1)) : 0;
    const end = range ? Math.max(start, Math.min(range.end, fullDateCols.length-1)) : fullDateCols.length-1;
    const isFiltered = start>0 || end<fullDateCols.length-1;
    const dateCols = fullDateCols.slice(start, end+1);

    let rowsHtml = playerRows.map(r=>{
      const name = r[0];
      const fullVals = r.slice(1, totalIdx>0?totalIdx:undefined);
      const vals = fullVals.slice(start, end+1);
      const total = totalIdx>0? r[totalIdx] : null;
      const rank = rankIdx>0? r[rankIdx] : null;
      return `<tr>
        <td class="rowlabel">${playerLink(name)}</td>
        ${vals.map(v=>`<td class="num ${numClass(v)}">${(v!=null && v!==0)?fmt(v):'—'}</td>`).join('')}
        ${totalIdx>0?`<td class="num total-col ${numClass(total)}">${total!=null?fmt(total):''}</td>`:''}
        ${rankIdx>0?`<td class="rank-col">${rank!=null?rank:''}</td>`:''}
      </tr>`;
    }).join('');

    const fullHostVals = hostRow.slice(1,totalIdx>0?totalIdx:undefined);
    const hostVals = fullHostVals.slice(start, end+1);
    let hostHtml = `<tr class="host-row"><td class="rowlabel">מארח</td>${hostVals.map(h=>`<td class="num">${h??''}</td>`).join('')}${totalIdx>0?'<td></td>':''}${rankIdx>0?'<td></td>':''}</tr>`;

    const filterNote = isFiltered
      ? ` מוצג טווח מסונן לפי הזום בגרף (${dateCols.length} מתוך ${fullDateCols.length} מפגשים) — הסה"כ והדירוג תמיד משקפים את העונה כולה.`
      : '';

    return `
      <div class="table-scroll"><table class="wide">
        <thead><tr>
          <th class="corner">שחקן</th>
          ${dateCols.map(d=>`<th>${d}</th>`).join('')}
          ${totalIdx>0?'<th>סה"כ</th>':''}
          ${rankIdx>0?'<th>דירוג</th>':''}
        </tr></thead>
        <tbody>
          ${hostHtml}
          ${rowsHtml}
        </tbody>
      </table></div>
      <div class="card-note">ירוק = רווח באותו מפגש · אדום = הפסד · "—" = לא השתתף/ה.${filterNote}</div>
    `;
  }

  // Builds the full players + sessions dataset (using canonical merged
  // identities) ready to write to Firestore, from the embedded baseline data.
  function buildFirestoreSeedData(){
    const playerNames = [];
    const seen = new Set();
    getYears().forEach(y=>{
      const table = DATA.years[y].table;
      const playerRows = table.slice(2).filter(r=>r[0]!=='סה"כ' && r[0]!=='סה"כ יומי');
      playerRows.forEach(r=>{
        const c = canonicalName(r[0]);
        if(!seen.has(c)){ seen.add(c); playerNames.push(c); }
      });
    });

    const players = playerNames.map((name,i)=>({ id: 'p'+String(i+1).padStart(3,'0'), name }));
    const nameToId = {};
    players.forEach(p=>{ nameToId[p.name] = p.id; });

    const sessions = [];
    getYears().forEach(y=>{
      const table = DATA.years[y].table;
      const hostRow = table[0];
      const dateRow = table[1];
      const totalIdx = dateRow.findIndex(v=>v==='סה"כ');
      const dateCols = dateRow.slice(1, totalIdx>0?totalIdx:undefined);
      const hostVals = hostRow.slice(1, totalIdx>0?totalIdx:undefined);
      const playerRows = table.slice(2).filter(r=>r[0]!=='סה"כ' && r[0]!=='סה"כ יומי');

      dateCols.forEach((dateStr, colIdx)=>{
        if(!dateStr) return;
        const results = {};
        playerRows.forEach(r=>{
          const val = r[1+colIdx];
          if(val !== null && val !== undefined && val !== 0){
            const pid = nameToId[canonicalName(r[0])];
            if(pid) results[pid] = val;
          }
        });
        if(Object.keys(results).length === 0) return; // skip blank columns
        const docId = y + '_' + String(dateStr).replace(/[.\s]/g,'-') + '_' + String(colIdx+1).padStart(2,'0');
        sessions.push({
          id: docId,
          date: dateStr,
          year: y,
          host: hostVals[colIdx] || null,
          results
        });
      });
    });

    return {players, sessions};
  }

  async function runFirestoreSeed(log, force){
    const db = getFirestore();
    if(!db){ log('❌ Firebase לא נטען כראוי. בדקו את החיבור לאינטרנט ורעננו את הדף.'); return; }

    const statusRef = db.collection('meta').doc('seed_status');
    if(!force){
      const existing = await statusRef.get();
      if(existing.exists){
        const d = existing.data();
        log(`⚠️ נראה שכבר בוצעה טעינה קודם (${d.sessionCount} מפגשים, ${d.seededAt}).`);
        log('לחצו שוב על הכפתור תוך 5 שניות כדי לטעון בכל זאת (ידרוס נתונים קיימים).');
        return 'confirm';
      }
    }

    log('אוסף את הנתונים הבסיסיים...');
    const {players, sessions} = buildFirestoreSeedData();
    log(`נמצאו ${players.length} שחקנים ו-${sessions.length} מפגשים. מתחיל כתיבה ל-Firestore...`);

    const allWrites = [];
    players.forEach(p=> allWrites.push({ref: db.collection('players').doc(p.id), data:{name:p.name}}));
    sessions.forEach(s=> allWrites.push({ref: db.collection('sessions').doc(s.id), data:{date:s.date, year:s.year, host:s.host, results:s.results}}));

    const chunkSize = 400;
    let written = 0;
    for(let i=0;i<allWrites.length;i+=chunkSize){
      const batch = db.batch();
      const slice = allWrites.slice(i,i+chunkSize);
      slice.forEach(w=>batch.set(w.ref, w.data));
      await batch.commit();
      written += slice.length;
      log(`נכתבו ${written} / ${allWrites.length} מסמכים...`);
    }

    await statusRef.set({
      seededAt: new Date().toISOString(),
      sessionCount: sessions.length,
      playerCount: players.length
    });
    log(`✅ הושלם בהצלחה! ${players.length} שחקנים, ${sessions.length} מפגשים נכתבו ל-Firestore.`);
  }

  }

  // Refreshes the dynamic parts of the Add/Delete forms (host select, player
  // checklist, year/date dropdowns) from the latest live caches — without
  // tearing down the form, so anything the user is mid-typing survives.
  function refreshSessionFormsIfPresent(){
    if(!document.getElementById('addModalOverlay')) return;
    if(!livePlayers.length) return;

    // host select: preserve current selection if still valid
    const hostSelect = document.getElementById('addHost');
    if(hostSelect){
      const prevVal = hostSelect.value;
      const mostRecent = liveSessions.slice().sort((a,b)=> sessionSortKey(b)-sessionSortKey(a))[0];
      const hostMatch = mostRecent ? livePlayers.find(p=>p.name===mostRecent.host) : null;
      hostSelect.innerHTML = livePlayers.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
      if(prevVal && livePlayers.some(p=>p.id===prevVal)) hostSelect.value = prevVal;
      else if(hostMatch) hostSelect.value = hostMatch.id;
    }

    // players checklist: preserve checked state + entered values if a player already exists in the DOM
    const listEl = document.getElementById('addPlayersList');
    if(listEl){
      const existing = {};
      listEl.querySelectorAll('.player-check-row').forEach(row=>{
        const signBtn = row.querySelector('.sign-toggle');
        existing[row.dataset.pid] = {
          checked: row.querySelector('input[type="checkbox"]').checked,
          value: row.querySelector('input[type="number"]').value,
          sign: signBtn ? signBtn.dataset.sign : '1'
        };
      });
      const mostRecent = liveSessions.slice().sort((a,b)=> sessionSortKey(b)-sessionSortKey(a))[0];
      const recentParticipants = mostRecent ? new Set(Object.keys(mostRecent.results||{})) : new Set();

      listEl.innerHTML = livePlayers.map(p=>{
        const prev = existing[p.id];
        const checked = prev ? prev.checked : recentParticipants.has(p.id);
        const value = prev ? prev.value : '';
        const sign = prev ? prev.sign : '1';
        return `<div class="player-check-row ${checked?'checked':''}" data-pid="${p.id}">
          <input type="checkbox" ${checked?'checked':''}>
          <span class="pname">${p.name}</span>
          <button type="button" class="sign-toggle ${sign==='-1'?'neg':'pos'}" data-sign="${sign}">${sign==='-1'?'−':'+'}</button>
          <input type="number" inputmode="decimal" min="0" placeholder="₪" value="${value}">
        </div>`;
      }).join('');

      listEl.querySelectorAll('.player-check-row').forEach(row=>{
        const cb = row.querySelector('input[type="checkbox"]');
        const num = row.querySelector('input[type="number"]');
        const signBtn = row.querySelector('.sign-toggle');
        cb.addEventListener('change', ()=>{ row.classList.toggle('checked', cb.checked); updateRunningTotal(); });
        num.addEventListener('input', updateRunningTotal);
        signBtn.addEventListener('click', ()=>{
          const flipped = signBtn.dataset.sign === '-1' ? '1' : '-1';
          signBtn.dataset.sign = flipped;
          signBtn.textContent = flipped === '-1' ? '−' : '+';
          signBtn.classList.toggle('neg', flipped === '-1');
          signBtn.classList.toggle('pos', flipped !== '-1');
          updateRunningTotal();
        });
      });
      updateRunningTotal();

      // re-apply an active search filter after the list was rebuilt
      const searchInput = document.getElementById('playerSearch');
      if(searchInput && searchInput.value.trim()){
        const q = searchInput.value.trim().toLowerCase();
        listEl.querySelectorAll('.player-check-row').forEach(row=>{
          const name = row.querySelector('.pname').textContent.toLowerCase();
          row.style.display = name.includes(q) ? '' : 'none';
        });

    }

    // delete-session year/date dropdowns
    const yearSel = document.getElementById('delYearSelect');
    if(yearSel){
      const prevYear = yearSel.value;
      const years = Array.from(new Set(liveSessions.map(s=>String(s.year)))).sort().reverse();
      yearSel.innerHTML = years.map(y=>`<option value="${y}">עונת ${y}</option>`).join('');
      if(years.includes(prevYear)) yearSel.value = prevYear;
      populateDeleteDateOptions();
    }
  }
  function sessionSortKey(s){
    const parts = String(s.date).split('.');
    const day = parseInt(parts[0],10)||1;
    const month = parseInt(parts[1],10)||1;
    const year = parseInt(s.year,10)||0;
    return year*10000 + month*100 + day;
  }

  function pstdev(vals){
    if(!vals.length) return 0;
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
    const variance = vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length;
    return Math.sqrt(variance);
  }

  function deriveDataFromFirestore(playersArr, sessionsArr){
    if(!playersArr.length || !sessionsArr.length) return null;
    const playerById = {};
    playersArr.forEach(p=>{ playerById[p.id] = p.name; });
    const isGuest = pid => /^אורח/.test(playerById[pid]||'');

    const sessionsSorted = sessionsArr.slice().sort((a,b)=> sessionSortKey(a)-sessionSortKey(b));

    // ---- group by year, build per-year table + chart ----
    const byYear = {};
    sessionsSorted.forEach(s=>{ (byYear[s.year] = byYear[s.year] || []).push(s); });
    const yearKeys = Object.keys(byYear).sort();

    const years = {};
    const yearWinners = {}; // year -> [ [pid,total], ... ] sorted desc

    yearKeys.forEach(y=>{
      const sess = byYear[y];
      const pidSet = new Set();
      sess.forEach(s=> Object.keys(s.results).forEach(pid=>pidSet.add(pid)));
      const pids = Array.from(pidSet);

      const totals = {};
      pids.forEach(pid=>{ totals[pid] = sess.reduce((sum,s)=> sum + (s.results[pid]||0), 0); });
      const ranked = pids.slice().sort((a,b)=> totals[b]-totals[a]);
      const rankOf = {}; ranked.forEach((pid,i)=>{ rankOf[pid]=i+1; });
      yearWinners[y] = ranked.map(pid=>[playerById[pid]||pid, totals[pid]]);

      const hostRow = ['מארח', ...sess.map(s=>s.host||'')];
      const dateRow = ['שם', ...sess.map(s=>s.date), 'סה"כ', 'דירוג'];
      const playerRows = pids.map(pid=>{
        const vals = sess.map(s=> (s.results[pid] !== undefined ? s.results[pid] : null));
        return [playerById[pid]||pid, ...vals, totals[pid], rankOf[pid]];
      });
      const table = [hostRow, dateRow, ...playerRows];

      const chart = [['שם', ...sess.map(s=>s.date)]];
      pids.forEach(pid=>{
        let running = 0;
        const cum = sess.map(s=>{ running += (s.results[pid]||0); return running; });
        chart.push([playerById[pid]||pid, ...cum]);
      });

      years[y] = {table, chart};
    });

    // ---- overall cumulative chart (all sessions, all known players) ----
    const allPids = playersArr.map(p=>p.id);
    const overall_chart = [['שם', ...sessionsSorted.map(s=>s.date)]];
    const totalsAll = {};
    allPids.forEach(pid=>{
      let running = 0;
      const cum = sessionsSorted.map(s=>{ running += (s.results[pid]||0); return running; });
      overall_chart.push([playerById[pid]||pid, ...cum]);
      totalsAll[pid] = running;
    });

    // ---- leaderboard ----
    const leaderboard = allPids
      .filter(pid=>!isGuest(pid))
      .map(pid=>[playerById[pid]||pid, totalsAll[pid]])
      .sort((a,b)=> b[1]-a[1]);

    // ---- synthetic summary sheet (champions table + winning margin) ----
    // Built as a plain sequential array (no sparse holes) since Array.find
    // visits every index including holes and throws on undefined ones.
    const summary = [[], []]; // indices 0,1 unused, matches original sheet layout
    summary.push([null, null, ...yearKeys]); // index 2: year header
    for(let rank=1; rank<=6; rank++){
      const row = [null, rank];
      yearKeys.forEach(y=>{
        const entry = yearWinners[y][rank-1];
        row.push(entry ? entry[0] : null);
      });
      summary.push(row);
    }
    const marginRow = [null, 'מקום ראשון שנתי'];
    yearKeys.forEach(y=>{
      const top = yearWinners[y][0];
      marginRow.push(top ? top[1] : null);
    });
    summary.push(marginRow);

    // ---- awards ----
    const stats = {};
    playersArr.forEach(p=>{ stats[p.id] = {sessions:0, wins:0, losses:0, biggest_win:null, biggest_loss:null, net:0, vals:[]}; });
    sessionsSorted.forEach(s=>{
      Object.entries(s.results).forEach(([pid,val])=>{
        if(val===0 || !stats[pid]) return;
        const st = stats[pid];
        st.sessions++; st.net += val; st.vals.push(val);
        if(val>0) st.wins++; else st.losses++;
        st.biggest_win = st.biggest_win===null ? val : Math.max(st.biggest_win, val);
        st.biggest_loss = st.biggest_loss===null ? val : Math.min(st.biggest_loss, val);
      });
    });
    const MIN_SESS = 40;
    const eligiblePids = playersArr.map(p=>p.id).filter(pid=>!isGuest(pid) && stats[pid].sessions>0);
    const withMinSess = eligiblePids.filter(pid=>stats[pid].sessions>=MIN_SESS);

    function pickTop(pool, keyFn, dir){
      let best=null, bestVal=null;
      pool.forEach(pid=>{
        const v = keyFn(pid);
        if(bestVal===null || (dir==='max'? v>bestVal : v<bestVal)){ bestVal=v; best=pid; }
      });
      return best;
    }

    const awards = [];
    if(eligiblePids.length){
      let pid = pickTop(eligiblePids, p=>stats[p].net, 'max');
      awards.push({id:'top_earner', name:playerById[pid], value:stats[pid].net});
      pid = pickTop(eligiblePids, p=>stats[p].net, 'min');
      awards.push({id:'top_donor', name:playerById[pid], value:stats[pid].net});
      pid = pickTop(eligiblePids, p=>stats[p].sessions, 'max');
      const yearsActive = new Set();
      sessionsSorted.forEach(s=>{ if(s.results[pid]!==undefined && s.results[pid]!==0) yearsActive.add(s.year); });
      awards.push({id:'most_dedicated', name:playerById[pid], value:stats[pid].sessions, extra:yearsActive.size});
    }
    if(withMinSess.length){
      let pid = pickTop(withMinSess, p=>stats[p].wins/stats[p].sessions, 'max');
      awards.push({id:'best_winrate', name:playerById[pid], value:Math.round(stats[pid].wins/stats[pid].sessions*1000)/10, extra:stats[pid].sessions});
      pid = pickTop(withMinSess, p=>stats[p].wins/stats[p].sessions, 'min');
      awards.push({id:'worst_winrate', name:playerById[pid], value:Math.round(stats[pid].wins/stats[pid].sessions*1000)/10, extra:stats[pid].sessions});
    }
    if(eligiblePids.length){
      let pid = pickTop(eligiblePids, p=>stats[p].biggest_win, 'max');
      awards.push({id:'biggest_win', name:playerById[pid], value:stats[pid].biggest_win});
      pid = pickTop(eligiblePids, p=>stats[p].biggest_loss, 'min');
      awards.push({id:'biggest_loss', name:playerById[pid], value:stats[pid].biggest_loss});
    }
    if(withMinSess.length){
      let pid = pickTop(withMinSess, p=>pstdev(stats[p].vals), 'max');
      awards.push({id:'most_volatile', name:playerById[pid], value:Math.round(pstdev(stats[pid].vals))});
    }

    const yearsNum = yearKeys.map(y=>parseInt(y,10)).filter(n=>!isNaN(n));
    const years_span = yearsNum.length ? [Math.min(...yearsNum), Math.max(...yearsNum)] : DATA.years_span;

    return {
      years, overall_chart, leaderboard, summary, awards,
      total_sessions: sessionsSorted.length,
      years_span,
      merge_map: DATA.merge_map,
      nickname_evolutions: DATA.nickname_evolutions,
    };
  }

  // ---------- Live sync: re-render the whole dashboard whenever Firestore changes ----------
  function rerenderAll(){
    const activeBtn = document.querySelector('.tab-btn.active');
    const activeTab = activeBtn ? activeBtn.dataset.tab : 'summary';
    document.getElementById('mainContent').innerHTML = '';
    chartInstance = null;

  // Module-level live caches, kept in sync with Firestore, so the
  // Add/Delete session forms can read the current player & session lists
  // (including real Firestore doc IDs) without a separate fetch.
  let livePlayers = [];   // [{id, name}]
  let liveSessions = [];  // [{id, date, year, host, results}]

  function startLiveSync(){
    const db = getFirestore();
    if(!db) return;
    let playersCache = null, sessionsCache = null;
    function tryRebuild(){
      if(!playersCache || !sessionsCache) return;
      try{
        const newData = deriveDataFromFirestore(playersCache, sessionsCache);
        if(newData){
          DATA = newData;
          rebuildColorMap();
          rerenderAll();
        }
      }catch(e){ console.error('Live rebuild from Firestore failed — keeping current data', e); }
    }
    db.collection('players').onSnapshot(
      snap=>{
        playersCache = snap.docs.map(d=>({id:d.id, name:d.data().name}));
        livePlayers = playersCache;
        tryRebuild();
        refreshSessionFormsIfPresent();
      },
      err=> console.error('players onSnapshot error', err)
    );
    db.collection('sessions').onSnapshot(
      snap=>{
        sessionsCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
        liveSessions = sessionsCache;
        tryRebuild();
        refreshSessionFormsIfPresent();
      },
      err=> console.error('sessions onSnapshot error', err)
    );
  }

  // ---------- Player profile modal ----------
  function computePlayerProfile(clickedName){
    const canon = canonicalName(clickedName);

    // full session-level stats (reuses the same computation as the stats tab)
    const allStats = computeAllPlayerStats();
    const stat = allStats[canon] || {sessions:0, wins:0, losses:0, longestWinStreak:0, longestLossStreak:0, currentStreak:0, currentStreakType:null};

    // all-time net total (from the leaderboard, already canonical + guest-aware)
    const lbEntry = (DATA.leaderboard||[]).find(([n])=>n===canon);
    const net = lbEntry ? lbEntry[1] : null;
    const lbRank = lbEntry ? (DATA.leaderboard.findIndex(([n])=>n===canon)+1) : null;

    // per-year breakdown: which years they played, total + rank each year
    const perYear = [];
    getYearsDesc().forEach(y=>{
      const table = DATA.years[y].table;
      const dateRow = table[1];
      const totalIdx = dateRow.findIndex(v=>v==='סה"כ');
      const rankIdx = dateRow.findIndex(v=>v==='דירוג');
      const playerRows = table.slice(2).filter(r=>r[0]!=='סה"כ' && r[0]!=='סה"כ יומי');
      const row = playerRows.find(r=>canonicalName(r[0])===canon);
      if(row){
        const sessionsThisYear = row.slice(1, totalIdx>0?totalIdx:undefined).filter(v=>v!=null && v!==0).length;
        perYear.push({
          year:y,
          total: totalIdx>0? row[totalIdx] : null,
          rank: rankIdx>0? row[rankIdx] : null,
          sessions: sessionsThisYear,
        });
      }
    });

    // awards currently held
    const awardsHeld = (DATA.awards||[]).filter(a=>a.name===canon);

    // rivalry / duo involvement
    const {bestRivalry, bestDuo} = computeRivalryFinder();
    let rivalryInfo = null;
    if(bestRivalry && (bestRivalry.a===canon || bestRivalry.b===canon)){
      rivalryInfo = {type:'rivalry', opponent: bestRivalry.a===canon?bestRivalry.b:bestRivalry.a, r:bestRivalry.r, n:bestRivalry.n};
    } else if(bestDuo && (bestDuo.a===canon || bestDuo.b===canon)){
      rivalryInfo = {type:'duo', opponent: bestDuo.a===canon?bestDuo.b:bestDuo.a, r:bestDuo.r, n:bestDuo.n};
    }

    // nickname history (if this player is one of the merged identities)
    const evolution = (DATA.nickname_evolutions||[]).find(e=>e.current===canon);

    // personal all-time cumulative chart data (from the same source as the "all-time" graph view)
    const chartRow = (DATA.overall_chart||[]).slice(1).find(r=>r[0]===canon);
    const chartLabels = chartRow ? DATA.overall_chart[0].slice(1) : [];
    const chartData = chartRow ? chartRow.slice(1) : [];

    return {
      name: canon, net, lbRank, stat, perYear, awardsHeld, rivalryInfo, evolution,
      chartLabels, chartData,
    };
  }

  // Rule-based "insight" text about a player — not a live LLM call (this file
  // has no safe way to hold an API key), but a template engine with several
  // phrasing variants per fact, randomly picked each time the profile opens.
  // Substance only changes when the underlying data changes; wording varies
  // per click so it doesn't feel robotic.
  function generatePlayerBlurb(p){
    const pick = arr => arr[Math.floor(Math.random()*arr.length)];
    const lines = [];

    if(p.lbRank === 1){
      lines.push(pick([
        `${p.name} עומד בראש הטבלה — פשוט הכי טוב שיש.`,
        `אין עוררין: ${p.name} הוא האלוף הבלתי מעורער של המועדון.`,
        `${p.name} מוביל את כל השחקנים בהיסטוריה של הקבוצה.`,
      ]));
    } else if(p.lbRank && p.lbRank<=3){
      lines.push(pick([
        `${p.name} נמצא בפודיום הכל-זמנים, במקום ${p.lbRank}.`,
        `אחד משלושת השחקנים הכי מוצלחים בהיסטוריית המועדון.`,
        `${p.name} שם קבוע בין המובילים — מקום ${p.lbRank} כל הזמנים.`,
      ]));
    } else if(p.net != null && p.net > 0){
      lines.push(pick([
        `${p.name} מסיים ברווח על פני כל הקריירה שלו במועדון.`,
        `למרות שלא בפודיום, ${p.name} עדיין ברווח נאה לאורך זמן.`,
        `${p.name} שומר על יתרון חיובי מצטבר — לא רע בכלל.`,
      ]));
    } else if(p.net != null && p.net < 0){
      lines.push(pick([
        `${p.name} עדיין בגירעון מצטבר — יש עבודה לעשות.`,
        `הקלפים לא תמיד אוהבים את ${p.name}, לפחות לא עד כה.`,
        `${p.name} נמצא כרגע במינוס כולל, אבל תמיד אפשר להתאושש.`,
      ]));
    }

    if(p.stat.sessions >= 10){
      const wr = p.stat.wins/p.stat.sessions*100;
      if(wr >= 55){
        lines.push(pick([
          `אחוז ניצחונות של ${wr.toFixed(0)}% — משמעותית מעל הממוצע.`,
          `${wr.toFixed(0)}% ניצחונות. זה לא מזל, זה עקביות.`,
          `רוב הערבים מסתיימים לטובתו: ${wr.toFixed(0)}% ניצחונות.`,
        ]));
      } else if(wr >= 48){
        lines.push(pick([
          `אחוז ניצחונות מאוזן של כ-${wr.toFixed(0)}%, בערך כמו הטלת מטבע.`,
          `${wr.toFixed(0)}% ניצחונות — לא רע, לא מדהים, יציב.`,
        ]));
      } else {
        lines.push(pick([
          `אחוז ניצחונות של ${wr.toFixed(0)}% בלבד — הלילות הטובים נדירים יותר.`,
          `רק ${wr.toFixed(0)}% מהערבים מסתיימים בניצחון, אבל הוא ממשיך לחזור.`,
        ]));
      }
    }

    if(p.stat.currentStreak >= 3){
      if(p.stat.currentStreakType === 'W'){
        lines.push(pick([
          `כרגע בלהיטות: רצף של ${p.stat.currentStreak} ניצחונות ברציפות.`,
          `${p.stat.currentStreak} ניצחונות רצופים — מישהו חם לאחרונה.`,
        ]));
      } else {
        lines.push(pick([
          `נמצא ברצף מאתגר של ${p.stat.currentStreak} הפסדים ברציפות.`,
          `${p.stat.currentStreak} הפסדים ברצף — תקופה פחות טובה כרגע.`,
        ]));
      }
    }

    if(p.stat.longestWinStreak >= 5){
      lines.push(pick([
        `השיא האישי שלו: רצף של ${p.stat.longestWinStreak} ניצחונות רצופים.`,
        `פעם אחת הוא ניצח ${p.stat.longestWinStreak} פעמים ברצף — שיא אישי.`,
      ]));
    }

    if(p.stat.sessions >= 200){
      lines.push(pick([
        `עם ${p.stat.sessions} מפגשים, הוא אחד השחקנים הכי ותיקים בקבוצה.`,
        `${p.stat.sessions} מפגשים ועדיין חוזר — מסירות אמיתית.`,
      ]));
    }

    if(p.rivalryInfo){
      if(p.rivalryInfo.type === 'rivalry'){
        lines.push(pick([
          `יש לו יריבות סטטיסטית משמעותית מול ${p.rivalryInfo.opponent}.`,
          `כשהוא עולה, ${p.rivalryInfo.opponent} בדרך כלל יורד — וההפך.`,
        ]));
      } else {
        lines.push(pick([
          `הגורל שלו נוטה לזוז יחד עם ${p.rivalryInfo.opponent}.`,
        ]));
      }
    }

    if(p.awardsHeld.length){
      lines.push(pick([
        `כרגע מחזיק ב-${p.awardsHeld.length} פרס${p.awardsHeld.length>1?'ים':''} רשמי${p.awardsHeld.length>1?'ים':''} של המועדון.`,
      ]));
    }

    if(p.evolution){
      const prevName = p.evolution.previous[p.evolution.previous.length-1];
      lines.push(pick([
        `שינה כינוי במהלך הדרך — פעם היה מוכר בתור "${prevName}".`,
      ]));
    }

    return lines.join(' ');
  }

  function openPlayerProfile(clickedName){
    buildProfileModal();
    const overlay = document.getElementById('profileModalOverlay');
    const content = document.getElementById('profileModalContent');
    const p = computePlayerProfile(clickedName);

    const medalFor = p.lbRank===1?'🥇':p.lbRank===2?'🥈':p.lbRank===3?'🥉':null;
    const winRate = p.stat.sessions ? Math.round(p.stat.wins/p.stat.sessions*1000)/10 : null;
    const streakText = p.stat.currentStreak>=2
      ? `${p.stat.currentStreak} ${p.stat.currentStreakType==='W'?'ניצחונות':'הפסדים'} ברצף`
      : 'אין רצף פעיל';

    const yearRowsHtml = p.perYear.map(y=>`
      <tr>
        <td class="rowlabel">${y.year}</td>
        <td class="num">${y.sessions}</td>
        <td class="num ${numClass(y.total)}">${y.total!=null?fmt(y.total):''}</td>
        <td class="rank-col">${y.rank??''}</td>
      </tr>`).join('');

    const awardsHtml = p.awardsHeld.map(a=>{
      const meta = AWARD_META[a.id];
      return meta ? `<div class="profile-award-pill">${meta.emoji} ${meta.label}</div>` : '';
    }).join('');

    const rivalryHtml = p.rivalryInfo ? `
      <div class="rivalry-card ${p.rivalryInfo.type}">
        <div class="rivalry-label">${p.rivalryInfo.type==='rivalry' ? '⚔️ היריבות הגדולה שלו' : '🤝 השותף המתואם שלו'}</div>
        <div class="rivalry-row">
          <div class="rivalry-name">${p.name}</div>
          <div class="rivalry-vs">${p.rivalryInfo.type==='rivalry'?'VS':'♥'}</div>
          <div class="rivalry-name">${playerLink(p.rivalryInfo.opponent)}</div>
        </div>
        <div class="rivalry-caption">מתאם ${p.rivalryInfo.r.toFixed(2)} על פני ${p.rivalryInfo.n} מפגשים משותפים.</div>
      </div>` : '';

    const evoHtml = p.evolution ? `
      <div class="card-note" style="margin-top:6px;">כונה בעבר: ${p.evolution.previous.join(' ← ')}</div>` : '';

    content.innerHTML = `
      <div class="profile-header">
        ${medalFor?`<div class="profile-medal">${medalFor}</div>`:''}
        <div class="profile-name">${p.name}</div>
        ${p.lbRank?`<div class="profile-rank">מקום ${p.lbRank} כל הזמנים</div>`:''}
        ${evoHtml}
      </div>

      <div class="profile-blurb">${generatePlayerBlurb(p)}</div>

      <div class="profile-stats-grid">
        <div class="profile-stat"><div class="profile-stat-val ${numClass(p.net)}">${p.net!=null?fmt(p.net)+' ₪':'—'}</div><div class="profile-stat-lbl">נטו כל הזמנים</div></div>
        <div class="profile-stat"><div class="profile-stat-val">${p.stat.sessions}</div><div class="profile-stat-lbl">מפגשים</div></div>
        <div class="profile-stat"><div class="profile-stat-val">${winRate!=null?winRate+'%':'—'}</div><div class="profile-stat-lbl">אחוז ניצחונות</div></div>
        <div class="profile-stat"><div class="profile-stat-val">${streakText}</div><div class="profile-stat-lbl">רצף נוכחי</div></div>
      </div>

      ${p.chartData.length ? `<div class="chart-wrap" style="height:220px;"><canvas id="profileChart"></canvas></div>` : ''}

      ${awardsHtml ? `<div class="section-title" style="margin-top:20px;">פרסים שהוא מחזיק</div><div class="profile-awards-row">${awardsHtml}</div>` : ''}

      ${rivalryHtml}

      ${p.perYear.length ? `
      <div class="section-title" style="margin-top:20px;"><span class="suit">♣</span> פירוט לפי שנה</div>
      <div class="table-scroll"><table>
        <thead><tr><th>שנה</th><th>מפגשים</th><th>סה"כ</th><th>דירוג</th></tr></thead>
        <tbody>${yearRowsHtml}</tbody>
      </table></div>` : ''}
    `;

    overlay.classList.add('open');

    if(p.chartData.length){
      const ctx = document.getElementById('profileChart').getContext('2d');
      if(profileChartInstance){ profileChartInstance.destroy(); }
      profileChartInstance = new Chart(ctx, {
        type:'line',
        data:{
          labels: p.chartLabels,
          datasets:[{
            data: p.chartData,
            borderColor: colorFor(p.name),
            backgroundColor: colorFor(p.name),
            borderWidth: 2,
            pointRadius: 0,
            tension:.2,
            spanGaps:true,
          }]
        },
        options: baseChartOptions()
      });
    }
  }

  // Single delegated click listener — works regardless of how many times
  // the page has been rebuilt by rerenderAll(), since it's attached once
  // to a stable ancestor rather than to each generated element.
  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-player-link]');
    if(!el) return;
    openPlayerProfile(el.dataset.playerLink);
  });

  // ---------- Init ----------
  function init(){
    rebuildColorMap();
    buildHeroStats();
    buildTabs();
    buildActionBar();
    buildSummaryPanel();
    buildAwardsPanel();
    buildStatsPanel();
    buildChartPanel();
    buildSessionModals();
    showTab('summary');
    startLiveSync();
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
