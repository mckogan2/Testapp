<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notification Test App</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 80px auto;
    text-align: center;
    color: #222;
  }
  button {
    font-size: 1rem;
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
    margin: 8px;
  }
  button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }
  #status {
    margin-top: 24px;
    color: #555;
  }
</style>
</head>
<body>
  <h1>Notification Test</h1>
  <p>Click the button to request permission and fire a test browser notification.</p>
  <p id="iosNote" hidden>On iPhone/iPad, Safari only allows notifications for sites added to the
    Home Screen: tap Share &rarr; Add to Home Screen, then open the app from there and try again.</p>
  <button id="requestBtn">Enable Notifications</button>
  <button id="sendBtn" disabled>Send Test Notification</button>
  <p id="status"></p>

<script>
  const requestBtn = document.getElementById('requestBtn');
  const sendBtn = document.getElementById('sendBtn');
  const status = document.getElementById('status');
  const iosNote = document.getElementById('iosNote');

  function setStatus(text) {
    status.textContent = text;
  }

  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (isIos && !isStandalone) {
    iosNote.hidden = false;
  }

  let swRegistration = null;

  async function init() {
    if (!('Notification' in window)) {
      setStatus('This browser does not support notifications.');
      requestBtn.disabled = true;
      return;
    }

    if ('serviceWorker' in navigator) {
      try {
        swRegistration = await navigator.serviceWorker.register('service-worker.js');
        await navigator.serviceWorker.ready;
      } catch (err) {
        console.error('Service worker registration failed', err);
      }
    }

    setStatus(`Current permission: ${Notification.permission}`);
    sendBtn.disabled = Notification.permission !== 'granted';
  }

  requestBtn.addEventListener('click', async () => {
    const permission = await Notification.requestPermission();
    setStatus(`Current permission: ${permission}`);
    sendBtn.disabled = permission !== 'granted';
  });

  sendBtn.addEventListener('click', async () => {
    const options = {
      body: 'This is a test notification from Notification Test App.',
      icon: 'icon.svg'
    };

    try {
      if (swRegistration) {
        // Mobile browsers (Chrome/Firefox for Android) require notifications
        // to be shown via a Service Worker; the plain constructor below throws there.
        await swRegistration.showNotification('Test Notification', options);
      } else {
        new Notification('Test Notification', options);
      }
      setStatus('Notification sent.');
    } catch (err) {
      setStatus(`Failed to send notification: ${err.message}`);
    }
  });

  init();
</script>
</body>
</html>
