name: Deploy Firebase Functions

on:
  push:
    branches: [claude/android-app-grocery-list]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      # Authenticates as the "github-actions-deploy" service account (set up
      # once in Google Cloud Console) instead of an interactive `firebase
      # login`, which isn't possible from CI.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --only functions --project family-grocery-list-bd6e3 --non-interactive
